{% extends "base.html" %}
{% block title %}404 — Page Not Found{% endblock %}

{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px;position:relative;z-index:2">
  <div>
    <div style="font-family:'Orbitron',sans-serif;font-size:120px;font-weight:900;
                background:linear-gradient(135deg,#c0392b,#e74c3c);
                -webkit-background-clip:text;-webkit-text-fill-color:transparent;
                line-height:1;margin-bottom:20px">404</div>
    <h2 style="font-family:'Orbitron',sans-serif;font-size:28px;margin-bottom:14px">Page Not Found</h2>
    <p style="color:var(--text-muted);max-width:400px;margin:0 auto 36px">
      The page you're looking for doesn't exist or has been moved.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
      <i class="fas fa-home"></i> Back to Home
    </a>
  </div>
</div>

{% include '_footer.html' %}
{% endblock %}
